apiVersion: v1
kind: Service
metadata:
    name: hyperion
    namespace: hyperion
spec:
    clusterIP: None
    publishNotReadyAddresses: true
    selector:
        app: hyperion
    ports:
        - name: http
          port: 8080
          targetPort: http
        - name: grpc
          port: 8081
          targetPort: grpc
        - name: raft
          port: 9001
          targetPort: raft
